spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env.local.properties[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/meetingmate?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

app:
  frontend-redirect-url: ${APP_FRONTEND_REDIRECT_URL:http://localhost:5173/oauth/callback}

meetingmate:
  openai-api-key: ${MEETINGMATE_OPENAI_API_KEY:}

openai:
  model: ${OPENAI_MODEL:gpt-4o-mini}
