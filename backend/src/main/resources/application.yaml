spring:

  application:
    name: meetingmate

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Google

  datasource:
    url: jdbc:mysql://localhost:3306/meetingmate
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Default is 30s: when MySQL went down every request waited 30s for a connection
      # and Tomcat threads piled up. Normal acquire wait is ~0.1ms (load test), so 3s
      # is generous and turns an outage into fast 503s instead of hanging requests.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  jpa:
    # OSIV off: with it on, a request keeps its DB connection until the response is
    # written, so /api/recommend held a connection for the whole ~3s OpenAI call and
    # starved the 10-connection pool (load test 2026-11-09, see docs/ops-log).
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8080}
  tomcat:
    # Needed for tomcat_threads_* metrics (thread-pool saturation under load).
    mbeanregistry:
      enabled: true

logging:
  level:
    root: INFO
  pattern:
    # Adds [requestId] to every log line (set by RequestIdFilter via MDC).
    level: "%5p [%X{requestId:-}]"

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_TO_32+_BYTES_SECRET_CHANGE_ME_123456}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:3600000}

app:
  frontend-redirect-url: ${APP_FRONTEND_REDIRECT_URL:http://localhost:5173/oauth/callback}

meetingmate:
  openai-api-key: ${MEETINGMATE_OPENAI_API_KEY:}

openai:
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  # Measured locally: mock p99 ~8s. Real responses (large JSON) can be slower, so 20s
  # leaves headroom; tune from production access logs (durationMs per request).
  connect-timeout: ${OPENAI_CONNECT_TIMEOUT:2s}
  call-timeout: ${OPENAI_CALL_TIMEOUT:20s}
  model: ${OPENAI_MODEL:gpt-4o-mini}

# --- Observability ---------------------------------------------------------
# Actuator runs on a separate management port bound to localhost by default,
# so it is never reachable through Nginx (which proxies only :8080).
# The local docker-compose stack overrides MANAGEMENT_ADDRESS=0.0.0.0 so the
# Prometheus container can scrape it; that port is never published publicly.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # readiness = "can serve traffic": include the DB so a load balancer / monitor
        # can stop routing here during a DB outage. liveness deliberately excludes the
        # DB: restarting the app cannot fix MySQL and would only add restart loops.
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: meetingmate
    distribution:
      # Histogram buckets let Prometheus compute p50/p95/p99 across instances.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s
